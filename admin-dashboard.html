<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Admin Dashboard | TutorRush</title>
  <link rel="stylesheet" href="app.css">
  <style>
    main.page { width: min(100% - 2.5rem, 1120px); }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-top: 1.5rem; }
    .stat { display: block; width: 100%; padding: 1.1rem; text-align: left; border: 1px solid var(--ink); border-radius: 1.2rem; background: #fff; box-shadow: .2rem .2rem 0 var(--ink); }
    .stat span { display: block; font-size: .75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; }
    .stat strong { display: block; margin-top: .3rem; font-size: 2.4rem; line-height: 1; }
    button.stat.current { background: var(--yellow); }
    .stat.static { cursor: default; background: #ffffffcc; }
    .toolbar { display: flex; gap: .8rem; flex-wrap: wrap; align-items: center; margin-top: 1.5rem; }
    .toolbar input { flex: 1; min-width: 14rem; }
    .toolbar select { min-width: 13rem; }
    .table-wrap { overflow-x: auto; margin-top: 1rem; border: 1px solid var(--ink); border-radius: 1.2rem; background: #fff; box-shadow: .25rem .25rem 0 var(--ink); }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: .8rem 1rem; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
    th { font-size: .72rem; text-transform: uppercase; letter-spacing: .06em; background: #f6ebff; }
    tr:last-child td { border-bottom: 0; }
    td select { min-width: 8rem; padding: .45rem 2rem .45rem .6rem; }
    .delete-button { padding: .45rem .8rem; background: #ffb4ab; }
    .empty { padding: 1.5rem; text-align: center; }
    .report { padding: 1rem 1.2rem; margin-top: .8rem; border: 1px solid var(--ink); border-radius: 1.2rem; background: #fff; box-shadow: .2rem .2rem 0 var(--ink); }
    .report.resolved { opacity: .7; }
    .report .meta { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; font-size: .78rem; font-weight: 700; }
    .report p { margin: .6rem 0; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="admin-dashboard.html"><span class="logo">TR</span><span>tutor rush</span></a>
    <div class="actions"><select id="viewSwitcher" aria-label="Dashboard view"></select><button id="logout" type="button">log out</button></div>
  </header>
  <main class="page">
    <p class="eyebrow">Admin dashboard</p>
    <h1>Keep TutorRush<br><em>moving.</em></h1>
    <p class="lead">Manage roles, review accounts, and switch into the student or tutor experience.</p>

    <section class="stats" aria-label="Account totals">
      <button class="stat current" type="button" data-filter="all"><span>Total accounts</span><strong id="countAll">-</strong></button>
      <button class="stat" type="button" data-filter="student"><span>Students</span><strong id="countStudent">-</strong></button>
      <button class="stat" type="button" data-filter="tutor"><span>Tutors</span><strong id="countTutor">-</strong></button>
      <button class="stat" type="button" data-filter="admin"><span>Admins</span><strong id="countAdmin">-</strong></button>
      <div class="stat static"><span>Bookings</span><strong id="bookingCount">-</strong></div>
      <div class="stat static"><span>Messages</span><strong id="messageCount">-</strong></div>
      <a class="stat static" href="#feedback" style="text-decoration:none;color:inherit"><span>Open feedback</span><strong id="feedbackOpenCount">-</strong></a>
    </section>
    <p id="bothNote" style="font-size:.85rem"></p>

    <section class="toolbar">
      <input id="search" type="search" placeholder="Search by name or email..." aria-label="Search accounts">
      <select id="roleFilter" aria-label="Filter by role">
        <option value="all">All accounts</option>
        <option value="student">Students (incl. both)</option>
        <option value="tutor">Tutors (incl. both)</option>
        <option value="both">Both roles only</option>
        <option value="admin">Admins</option>
      </select>
    </section>
    <p class="status" id="status" role="status"></p>

    <div class="table-wrap">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th><th>Change role</th><th></th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>

    <section id="feedback" style="margin-top:2.5rem">
      <div class="row">
        <h2 style="margin:0">Feedback &amp; issue reports</h2>
        <select id="feedbackFilter" aria-label="Filter feedback">
          <option value="open">Open</option>
          <option value="resolved">Resolved</option>
          <option value="all">All reports</option>
        </select>
      </div>
      <p class="status" id="feedbackStatus" role="status"></p>
      <div id="feedbackList"></div>
    </section>
  </main>

  <script src="app.js"></script>
  <script>
    const status = document.getElementById('status');
    const roleFilter = document.getElementById('roleFilter');
    const search = document.getElementById('search');
    let users = [];
    let currentUserId = null;

    function matchesRole(user, filter) {
      if (filter === 'all') return true;
      if (filter === 'student') return user.role === 'student' || user.role === 'both';
      if (filter === 'tutor') return user.role === 'tutor' || user.role === 'both';
      return user.role === filter;
    }

    function renderCounts() {
      const count = (filter) => users.filter((user) => matchesRole(user, filter)).length;
      document.getElementById('countAll').textContent = users.length;
      document.getElementById('countStudent').textContent = count('student');
      document.getElementById('countTutor').textContent = count('tutor');
      document.getElementById('countAdmin').textContent = count('admin');
      const both = count('both');
      document.getElementById('bothNote').textContent = both ? `${both} account${both === 1 ? '' : 's'} with both roles count as a student and a tutor.` : '';
    }

    function renderUsers() {
      const filter = roleFilter.value;
      const term = search.value.trim().toLowerCase();
      document.querySelectorAll('.stat[data-filter]').forEach((card) => card.classList.toggle('current', card.dataset.filter === filter));
      const visible = users.filter((user) => matchesRole(user, filter) && (!term || user.name.toLowerCase().includes(term) || user.email.toLowerCase().includes(term)));
      const body = document.getElementById('usersBody');
      body.replaceChildren();
      if (!visible.length) {
        const row = element('tr');
        const cell = element('td', 'empty', 'No accounts match your search.');
        cell.colSpan = 6;
        row.appendChild(cell);
        body.appendChild(row);
      }
      visible.forEach((user) => {
        const row = element('tr');
        row.append(element('td', '', user.name), element('td', '', user.email), element('td', '', user.role), element('td', '', formatDateTime(user.created_at.replace(' ', 'T') + 'Z')));

        const roleCell = element('td');
        const roleSelect = element('select');
        ['student', 'tutor', 'both', 'admin'].forEach((role) => {
          const option = new Option(role, role, false, role === user.role);
          roleSelect.add(option);
        });
        roleSelect.addEventListener('change', async () => {
          try {
            await api('admin-set-role', { userId: user.id, role: roleSelect.value });
            await loadUsers();
          } catch (error) {
            setStatus(status, error.message, 'error');
            roleSelect.value = user.role;
          }
        });
        roleCell.appendChild(roleSelect);

        const deleteCell = element('td');
        const deleteButton = element('button', 'delete-button', 'delete');
        deleteButton.type = 'button';
        deleteButton.disabled = user.id === currentUserId;
        deleteButton.addEventListener('click', async () => {
          if (!confirm(`Delete ${user.name}'s account? This cannot be undone.`)) return;
          try {
            await api('admin-delete-user', { userId: user.id });
            await loadUsers();
          } catch (error) {
            setStatus(status, error.message, 'error');
          }
        });
        deleteCell.appendChild(deleteButton);
        row.append(roleCell, deleteCell);
        body.appendChild(row);
      });
      setStatus(status, `Showing ${visible.length} of ${users.length} accounts.`);
    }

    async function loadUsers() {
      const data = await api('admin-dashboard');
      users = data.users;
      document.getElementById('bookingCount').textContent = data.summary.bookings;
      document.getElementById('messageCount').textContent = data.summary.messages;
      renderCounts();
      renderUsers();
    }

    const $ = (id) => document.getElementById(id);
    const CATEGORY_LABELS = { bug: 'Something broken', video: 'Video call', chat: 'Chat', files: 'Files', suggestion: 'Suggestion', other: 'Other' };
    let reports = [];

    function renderFeedback() {
      const filter = $('feedbackFilter').value;
      const list = $('feedbackList');
      $('feedbackOpenCount').textContent = reports.filter((report) => report.status === 'open').length;
      const visible = reports.filter((report) => filter === 'all' || report.status === filter);
      list.replaceChildren();
      setStatus($('feedbackStatus'), `Showing ${visible.length} of ${reports.length} reports.`);
      visible.forEach((report) => {
        const card = element('article', `report ${report.status}`);
        const meta = element('div', 'meta');
        meta.append(
          element('span', `badge ${report.status === 'open' ? '' : 'ended'}`, CATEGORY_LABELS[report.category] || report.category),
          element('span', '', `${report.userName} (${report.userRole}) \u00b7 ${report.userEmail}`),
          element('span', '', formatDateTime(report.createdAt)),
        );
        if (report.roomId) meta.appendChild(element('span', '', `Room #${report.roomId}${report.roomSubject ? ` \u00b7 ${report.roomSubject}` : ''}`));
        if (report.page) meta.appendChild(element('span', '', `Page: ${report.page}`));
        const toggle = element('button', report.status === 'open' ? 'green' : 'plain', report.status === 'open' ? 'mark resolved' : 'reopen');
        toggle.type = 'button';
        toggle.addEventListener('click', async () => {
          try {
            await api('admin-set-feedback-status', { reportId: report.id, status: report.status === 'open' ? 'resolved' : 'open' });
            await loadFeedback();
          } catch (error) {
            setStatus($('feedbackStatus'), error.message, 'error');
          }
        });
        card.append(meta, element('p', '', report.message), toggle);
        list.appendChild(card);
      });
    }

    async function loadFeedback() {
      reports = (await api('admin-feedback')).reports;
      renderFeedback();
    }

    $('feedbackFilter').addEventListener('change', renderFeedback);

    document.querySelectorAll('.stat[data-filter]').forEach((card) => card.addEventListener('click', () => {
      roleFilter.value = card.dataset.filter;
      renderUsers();
    }));
    roleFilter.addEventListener('change', renderUsers);
    search.addEventListener('input', renderUsers);

    (async () => {
      try {
        const user = await loadSession();
        if (!user) return;
        if (user.role !== 'admin') {
          location.replace(routes[user.role === 'tutor' ? 'tutor' : 'student']);
          return;
        }
        currentUserId = user.id;
        setupHeader(user, 'admin');
        await loadUsers();
        await loadFeedback();
      } catch (error) {
        setStatus(status, error.message, 'error');
      }
    })();
  </script>
</body>
</html>
