<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | TutorRush</title>
  <style>
    :root{--ink:#2d2443;--yellow:#fff08e;--green:#d6fa99;--line:rgba(45,36,67,.22)}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(120deg,#ffeaf4,#f6ebff 48%,#e5f7ca);font-family:Arial,sans-serif}main{width:min(100% - 2.5rem,470px);margin:12vh auto;padding:2rem;border:1px solid rgba(255,255,255,.8);border-radius:1.5rem;background:rgba(255,255,255,.58);box-shadow:0 1rem 2.5rem rgba(105,77,148,.12)}h1{margin:0;font-size:clamp(2.8rem,8vw,5rem);line-height:.9;letter-spacing:-.06em}p{line-height:1.5}form{display:grid;gap:1rem;margin-top:2rem}label{display:grid;gap:.4rem;font-size:.8rem}input{padding:.85rem;border:1px solid var(--ink);border-radius:.65rem;font-size:1rem}button{width:max-content;padding:.85rem 1.2rem;border:1px solid var(--ink);border-radius:999px;background:var(--yellow);box-shadow:.14rem .14rem 0 var(--ink);font-size:.9rem;cursor:pointer}.status{min-height:1.4rem;color:#9b3f62;font-size:.85rem}a{color:inherit}
  </style>
</head>
<body>
  <main>
    <h1>let’s get you<br><em>back in.</em></h1>
    <p>Enter your email and we’ll send a secure password reset link.</p>
    <form id="request-form">
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
      <button type="submit">send reset link</button>
    </form>
    <p class="status" id="status" role="alert" aria-live="polite"></p>
    <a href="login.html">Back to log in</a>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('request-form');
    const status = document.getElementById('status');
    if (token) {
      form.innerHTML = '<label>New password<input type="password" name="password" minlength="8" required></label><button type="submit">set new password</button>';
    }
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      try {
        const session = await fetch('tutoring-api.php?action=session', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({action:'session'}) }).then(response => response.json());
        const body = token ? { action:'reset-password', token, password:form.elements.password.value } : { action:'request-password-reset', email:form.elements.email.value };
        const response = await fetch(`tutoring-api.php?action=${body.action}`, { method:'POST', headers:{'Content-Type':'application/json','X-CSRF-Token':session.csrfToken || ''}, body:JSON.stringify(body) });
        const result = await response.json();
        status.textContent = response.ok ? (result.message || 'Done.') : (result.error || 'Something went wrong.');
      } catch (error) { status.textContent = 'We could not reach TutorRush. Please try again.'; }
    });
  </script>
</body>
</html>
