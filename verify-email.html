<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fredoka:wght@500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600;1,700&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#2d2443;--yellow:#fff08e;--green:#d6fa99;--pink:#ffb8d9;--purple:#dccbff;--blue:#bbd4ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;color:var(--ink);font-family:"DM Sans",sans-serif;background:linear-gradient(120deg,#ffeaf4,#f6ebff 48%,#e5f7ca);background-size:160% 160%;animation:bg 16s ease-in-out infinite alternate;overflow:hidden}body:before,body:after{position:fixed;z-index:-1;content:"";border-radius:50%;pointer-events:none}body:before{width:16rem;height:16rem;top:-5rem;right:10%;background:rgba(255,240,142,.7);animation:float 10s ease-in-out infinite alternate}body:after{width:12rem;height:12rem;bottom:-4rem;left:8%;background:rgba(187,212,255,.65);animation:float 8s ease-in-out infinite alternate-reverse}main{width:min(100% - 2.5rem,520px);padding:clamp(2rem,6vw,3.5rem);border:1px solid rgba(255,255,255,.88);border-radius:2rem;background:rgba(255,255,255,.64);box-shadow:0 1.2rem 3rem rgba(105,77,148,.16);backdrop-filter:blur(16px);text-align:center}.logo{display:grid;width:3rem;height:3rem;margin:0 auto 1.4rem;place-items:center;border-radius:.85rem;color:#fff;background:linear-gradient(135deg,var(--pink),var(--purple) 48%,var(--blue));box-shadow:.18rem .18rem 0 rgba(45,36,67,.28);font:800 1.3rem/1 "DM Sans",sans-serif;letter-spacing:-.12em}.eyebrow{margin:0 0 .9rem;font:500 .72rem "DM Mono",monospace;text-transform:uppercase;letter-spacing:.04em}h1{margin:0;font:600 clamp(2.8rem,8vw,5.6rem)/.88 "Fredoka",sans-serif;letter-spacing:-.06em}h1 em{font-family:"Playfair Display",serif;font-weight:600}p{line-height:1.55}.status{min-height:3rem;margin:1.25rem auto 0;max-width:34ch;color:#756d87}.status.success{color:#3d7650}.status.error{color:#9b3f62}.status.success:before{content:"✓";display:grid;width:2.5rem;height:2.5rem;margin:0 auto .75rem;place-items:center;border:1px solid var(--ink);border-radius:50%;background:var(--green);color:var(--ink);font:700 1.2rem Arial,sans-serif}.status.error:before{content:"!";display:grid;width:2.5rem;height:2.5rem;margin:0 auto .75rem;place-items:center;border:1px solid var(--ink);border-radius:50%;background:var(--pink);color:var(--ink);font:700 1.2rem Arial,sans-serif}a{display:inline-block;margin-top:1rem;padding:.82rem 1.15rem;border:1px solid var(--ink);border-radius:999px;background:var(--yellow);color:var(--ink);text-decoration:none;font:600 .85rem "DM Mono",monospace;box-shadow:.14rem .14rem 0 var(--ink);transition:transform .18s ease,background .18s ease,box-shadow .18s ease}a:hover{background:var(--green);transform:translateY(-2px);box-shadow:.05rem .05rem 0 var(--ink)}@keyframes bg{from{background-position:0 30%}to{background-position:100% 70%}}@keyframes float{from{transform:translate(0) scale(1)}to{transform:translate(1.5rem,1rem) scale(1.1)}}@media(prefers-reduced-motion:reduce){body,body:before,body:after{animation:none}}
  </style>
</head>
<body><main><div class="logo" aria-hidden="true">TR</div><p class="eyebrow">TutorRush account</p><h1>confirm your<br><em>email.</em></h1><p class="status" id="status">Checking your confirmation link...</p><a href="login.html">Go to log in</a></main><script>
const token=new URLSearchParams(location.search).get('token');const status=document.getElementById('status');const setStatus=(message,type)=>{status.textContent=message;status.className=`status ${type}`};if(!token){setStatus('This confirmation link is missing.','error')}else{fetch('tutoring-api.php?action=verify-email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'verify-email',token})}).then(response=>response.json().then(data=>({ok:response.ok,data}))).then(({ok,data})=>{setStatus(ok?'Your email is confirmed. You can log in now.':data.error||'This confirmation link is invalid or expired.',ok?'success':'error')}).catch(()=>{setStatus('We could not reach TutorRush. Please try again.','error')})}
</script></body></html>
