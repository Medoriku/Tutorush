  <style>
    :root { --ink:#171716; --paper:#fffdf9; --lemon:#ffe64c; --line:#171716; } *{box-sizing:border-box} body{margin:0;min-height:100vh;color:var(--ink);background:linear-gradient(120deg,#ffeaf4,#f6ebff 48%,#e5f7ca);background-size:160% 160%;animation:background-shift 16s ease-in-out infinite alternate;font-family:"DM Sans",sans-serif;overflow-x:hidden}body::before,body::after{position:fixed;z-index:-1;content:"";border-radius:50%;pointer-events:none}body::before{width:16rem;height:16rem;top:16%;left:-5rem;background:rgba(255,240,142,.7);animation:float-one 12s ease-in-out infinite alternate}body::after{width:13rem;height:13rem;right:-3rem;bottom:6%;background:rgba(187,212,255,.66);animation:float-two 10s ease-in-out infinite alternate}header{display:flex;align-items:center;justify-content:space-between;gap:1rem;width:min(1120px,calc(100% - 2.5rem));margin:1rem auto;padding:.55rem .7rem .55rem 1rem;border:1px solid rgba(255,255,255,.82);border-radius:999px;background:rgba(255,255,255,.64);box-shadow:0 .65rem 1.75rem rgba(105,77,148,.12);backdrop-filter:blur(14px)}.wordmark{display:inline-flex;align-items:center;gap:.65rem;color:inherit;font:600 1.18rem "Fredoka",sans-serif;letter-spacing:.01em;text-decoration:none}.logo{display:grid;width:2.7rem;height:2.7rem;place-items:center;border-radius:.75rem;color:white;background:linear-gradient(135deg,#ffb8d9,#dccbff 48%,#bbd4ff);box-shadow:0 .45rem 1.2rem rgba(129,102,188,.24);font:800 1.2rem/1 "DM Sans",sans-serif;letter-spacing:-.12em}.brand-name{color:#5f4b86;text-shadow:1px 1px 0 rgba(255,255,255,.9)}nav{display:flex;align-items:center;gap:.28rem;padding:.2rem;border-radius:999px;background:rgba(220,203,255,.48)}nav a{padding:.52rem .8rem;border:1px solid transparent;border-radius:999px;font:500 .82rem "DM Mono",monospace;text-decoration:none;transition:transform .18s ease,background .18s ease,box-shadow .18s ease}nav a:hover,nav a[aria-current="page"]{background:white;box-shadow:0 .2rem .55rem rgba(105,77,148,.13);transform:translateY(-1px) rotate(-2deg)}nav .nav-signup{border-color:var(--ink);background:#d6fa99;box-shadow:.13rem .13rem 0 var(--ink)}nav .nav-signup:hover{background:#fff08e;box-shadow:.06rem .06rem 0 var(--ink);transform:translate(.07rem,.07rem) rotate(2deg)}main{position:relative;z-index:1;width:min(100% - 2.5rem,470px);margin:clamp(3rem,8vh,6rem) auto;padding:2rem;border:1px solid rgba(255,255,255,.78);border-radius:1.5rem;background:rgba(255,255,255,.52);box-shadow:0 1rem 2.5rem rgba(105,77,148,.12);backdrop-filter:blur(12px)}h1{margin:0;font-size:clamp(3rem,9vw,5.4rem);line-height:.85;letter-spacing:-.07em}h1 em{font-family:"Playfair Display",serif}p{line-height:1.5}form{display:grid;gap:1rem;margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--line)}label{display:grid;gap:.45rem;font:500 .8rem "DM Mono",monospace}input{width:100%;padding:.85rem .95rem;border:1px solid var(--line);border-radius:0;background:rgba(255,255,255,.8);font:1rem "DM Sans",sans-serif}button{width:max-content;margin-top:.5rem;padding:.8rem 1.25rem;border:1px solid var(--line);border-radius:999px;background:var(--lemon);color:var(--ink);font:500 .95rem "DM Mono",monospace;cursor:pointer}.alternate{margin-top:1.4rem}a{color:inherit;text-underline-offset:.25em}@keyframes background-shift{from{background-position:0% 30%}to{background-position:100% 70%}}@keyframes float-one{from{border-radius:50%;transform:translate(0,0) scale(1)}to{border-radius:43% 57% 49% 51%;transform:translate(2rem,1rem) scale(1.1)}}@keyframes float-two{from{border-radius:50%;transform:translate(0,0)}to{border-radius:59% 41% 47% 53%;transform:translate(-1rem,-2rem) scale(.9)}}@media(prefers-reduced-motion:reduce){body,body::before,body::after{animation:none}}@media(max-width:720px){header{width:min(100% - 1.5rem,1120px);margin:.75rem auto;padding:.45rem .5rem .45rem .7rem}.wordmark{gap:.42rem;font-size:1rem}nav{gap:.08rem;padding:.14rem}nav a{padding:.42rem .48rem;font-size:.68rem}main{padding:1.5rem}}
    nav a:hover,nav a[aria-current="page"] { transform:translateY(-1px); }
    nav .nav-signup:hover { background:#fff08e; box-shadow:.04rem .04rem 0 rgba(45,36,67,.45); transform:translateY(-2px); }
    button { transition:transform .18s ease,background .18s ease,box-shadow .18s ease; }
    button { box-shadow:.1rem .1rem 0 rgba(23,23,22,.45); }
    button:hover { background:#ffb8d9; box-shadow:.04rem .04rem 0 rgba(23,23,22,.45); transform:translateY(-2px); }
    nav .nav-login { background:#ffb8d9; box-shadow:.1rem .1rem 0 rgba(45,36,67,.45); }
    nav .nav-login:hover { background:#dccbff; box-shadow:.04rem .04rem 0 rgba(45,36,67,.45); transform:translateY(-2px); }
    nav .nav-faq { background:#bbd4ff; box-shadow:.1rem .1rem 0 rgba(45,36,67,.45); }
    nav .nav-faq:hover { background:#ffb8d9; box-shadow:.04rem .04rem 0 rgba(45,36,67,.45); transform:translateY(-2px); }
    nav a:hover,nav a[aria-current="page"] { box-shadow:.04rem .04rem 0 rgba(45,36,67,.45); transform:translateY(-2px); }
    nav a { border-color:#171716; }
    nav { gap:.45rem; padding:0; border-radius:0; background:transparent; }
    nav .nav-signup,nav .nav-signup:hover { background:#d6fa99; box-shadow:.1rem .1rem 0 rgba(45,36,67,.45); }
    nav .nav-login,nav .nav-login:hover { background:#bbd4ff; box-shadow:.1rem .1rem 0 rgba(45,36,67,.45); }
    nav .nav-faq,nav .nav-faq:hover { background:#ffb8d9; box-shadow:.1rem .1rem 0 rgba(45,36,67,.45); }
    nav a:hover { box-shadow:.04rem .04rem 0 rgba(45,36,67,.45); transform:translateY(-2px); }
    nav a[aria-current="page"],nav a[aria-current="page"]:hover { background:#fff08e !important; }
    .google-button { display:flex; align-items:center; justify-content:center; gap:.65rem; width:100%; margin:2rem 0 1.35rem; padding:.82rem 1rem; border:1px solid var(--line); border-radius:999px; background:#fff; color:var(--ink); box-shadow:.1rem .1rem 0 rgba(23,23,22,.45); cursor:pointer; font:500 .9rem "DM Mono",monospace; transition:transform .18s ease,background .18s ease,box-shadow .18s ease; }
    .google-button:hover { background:var(--blue); transform:translateY(-2px); box-shadow:.04rem .04rem 0 rgba(23,23,22,.45); }
    .google-mark { display:grid; width:1.25rem; height:1.25rem; place-items:center; border:1px solid #4285f4; border-radius:50%; color:#4285f4; font:700 .8rem Arial,sans-serif; }
    .auth-divider { display:flex; align-items:center; gap:.75rem; color:#756d87; font:500 .7rem "DM Mono",monospace; text-transform:uppercase; }
    .auth-divider::before,.auth-divider::after { content:""; height:1px; flex:1; background:var(--line); }
    .google-status { min-height:1.2rem; margin:.7rem 0 0; color:#756d87; text-align:center; font-size:.78rem; }
    .signup-status { min-height:1.4rem; margin:1rem 0 0; color:#9b3f62; line-height:1.4; font-size:.85rem; }
    .signup-status a { color:var(--ink); font-weight:700; }
  </style>
</head>
<body>
  <header><a class="wordmark" href="student-landing.html" aria-label="TutorRush home"><span class="logo" aria-hidden="true">TR</span><span class="brand-name">tutor rush</span></a><nav aria-label="Primary navigation"><a class="nav-signup" href="sign-up.html" aria-current="page">sign up</a><a class="nav-login" href="login.html">log in</a><a class="nav-faq" href="faq.html">FAQ</a></nav></header>
  <main>
    <h1>Find a tutor who<br><em>makes it click.</em></h1>
    <p>Let's get to know you.</p>
    <button class="google-button" type="button" id="google-signup"><span class="google-mark" aria-hidden="true">G</span>Continue with Google</button>
    <p class="google-status" id="google-status" aria-live="polite"></p>
    <div class="auth-divider">or</div>
    <form action="tutoring-api.php?action=signup" method="post" id="signup-form" novalidate>
      <label>First name<input type="text" name="firstName" autocomplete="given-name" required></label>
      <label>Last name<input type="text" name="lastName" autocomplete="family-name" required></label>
      <input type="hidden" name="name" id="full-name">
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
      <label>Password<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
      <label>Account type<select name="role"><option value="student">Student</option><option value="tutor">Tutor</option><option value="both">Student + tutor</option></select></label>
      <button type="submit">create account</button>
    </form>
    <p class="signup-status" id="signup-status" role="alert" aria-live="polite"></p>
    <p class="alternate">Already have an account? <a href="login.html">Log in.</a></p>
  </main>
  <script>
    const signupForm = document.getElementById('signup-form');
    const signupStatus = document.getElementById('signup-status');

    signupForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      const form = event.currentTarget;
      form.elements.name.value = `${form.elements.firstName.value.trim()} ${form.elements.lastName.value.trim()}`.trim();
      const submitButton = form.querySelector('button[type="submit"]');
      submitButton.disabled = true;
      submitButton.textContent = 'creating...';
      signupStatus.textContent = '';

      try {
        const sessionResponse = await fetch('tutoring-api.php?action=session', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ action: 'session' })
        });
        const sessionData = await sessionResponse.json();
        const formData = Object.fromEntries(new FormData(form));
        const signupResponse = await fetch('tutoring-api.php?action=signup', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-CSRF-Token': sessionData.csrfToken || ''
          },
          body: JSON.stringify({ action: 'signup', ...formData })
        });
        const signupData = await signupResponse.json();

        if (!signupResponse.ok) {
          signupStatus.innerHTML = signupResponse.status === 409
            ? 'An account already exists for that email. <a href="login.html">Log in here.</a>'
            : (signupData.error || 'We could not create your account. Please try again.');
          return;
        }

        const dashboardByRole = { student: 'student-dashboard.html', tutor: 'tutor-dashboard.html', both: 'student-dashboard.html', admin: 'admin-dashboard.html' };
        window.location.href = dashboardByRole[signupData.user.role] || 'student-dashboard.html';
      } catch (error) {
        signupStatus.textContent = window.location.protocol === 'file:'
          ? 'This page is opened from your computer. Open it through your hosted site to create an account.'
          : 'We could not reach TutorRush. Please try again.';
      } finally {
        submitButton.disabled = false;
        submitButton.textContent = 'create account';
      }
    });
  </script>
</body>
<script>
  document.getElementById('google-signup').addEventListener('click', () => {
    document.getElementById('google-status').textContent = 'Google sign-in will be available soon.';
  });
</script>
</html>
